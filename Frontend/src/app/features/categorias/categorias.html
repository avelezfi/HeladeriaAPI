<section class="lectura">
  <h1>Categorías</h1>
  @if (cargando()) {
    <p role="status">Cargando categorías…</p>
  } @else if (error()) {
    <div class="aviso" role="alert">
      <p>{{ error() }}</p>
      <button type="button" class="boton boton--secundario" (click)="cargar()">Reintentar</button>
    </div>
  } @else {
    <table>
      <caption class="solo-lectores">Lista de categorías</caption>
      <thead><tr><th scope="col">Categoría</th><th scope="col">Productos</th></tr></thead>
      <tbody>
        @for (c of filas(); track c.categoriaId) {
          <tr><th scope="row">{{ c.nombre }}</th><td>{{ c.cantidad }}</td></tr>
        } @empty {
          <tr><td colspan="2">No hay categorías registradas.</td></tr>
        }
      </tbody>
    </table>
  }
</section>
