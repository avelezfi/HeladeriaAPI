<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">HeladApp · HeladeriaAPI</title>
  <desc id="d">Portada del proyecto: pedidos de heladería desde la mesa, con .NET 10, Angular 21 y SQL Server.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe4ec"/>
      <stop offset="0.55" stop-color="#fef1d6"/>
      <stop offset="1" stop-color="#ddf5ec"/>
    </linearGradient>
    <pattern id="barquillo" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#e9a95a"/>
      <rect width="3" height="18" fill="#c98a3f"/>
      <rect width="18" height="3" fill="#c98a3f"/>
    </pattern>
    <style>
      .titulo { font-family: 'Fredoka', 'Segoe UI Rounded', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif; font-weight: 700; }
      .texto  { font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Tarjeta -->
  <rect x="0" y="0" width="1200" height="420" rx="32" fill="url(#fondo)"/>
  <rect x="2" y="2" width="1196" height="416" rx="30" fill="none" stroke="#3b2230" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Confites -->
  <g stroke-linecap="round" stroke-width="7" opacity="0.85">
    <line x1="70" y1="52" x2="88" y2="44" stroke="#f4c0d1"/>
    <line x1="520" y1="40" x2="530" y2="56" stroke="#9fe1cb"/>
    <line x1="740" y1="300" x2="758" y2="308" stroke="#fac775"/>
    <line x1="1130" y1="60" x2="1140" y2="78" stroke="#f4c0d1"/>
    <line x1="1110" y1="350" x2="1128" y2="342" stroke="#9fe1cb"/>
    <line x1="700" y1="70" x2="716" y2="62" stroke="#fac775"/>
  </g>

  <!-- Texto principal -->
  <text x="80" y="118" class="texto" font-size="22" font-weight="700" fill="#3b2230" fill-opacity="0.65" letter-spacing="3">HELADERIAAPI · PROYECTO FINAL</text>
  <text x="76" y="205" class="titulo" font-size="96" fill="#3b2230">HeladApp</text>
  <text x="80" y="252" class="texto" font-size="28" fill="#3b2230">Pide desde tu mesa, sin filas</text>

  <!-- Botones de mesa, como en la pantalla de inicio -->
  <g class="texto" font-weight="700" text-anchor="middle">
    <rect x="80" y="288" width="92" height="76" rx="16" fill="#ffffff" stroke="#3b2230" stroke-width="3"/>
    <text x="126" y="316" font-size="15" fill="#3b2230" fill-opacity="0.7">Mesa</text>
    <text x="126" y="350" class="titulo" font-size="32" fill="#3b2230">1</text>

    <rect x="188" y="288" width="92" height="76" rx="16" fill="#f4c0d1" stroke="#3b2230" stroke-width="3"/>
    <text x="234" y="316" font-size="15" fill="#3b2230" fill-opacity="0.7">Mesa</text>
    <text x="234" y="350" class="titulo" font-size="32" fill="#3b2230">2</text>

    <rect x="296" y="288" width="92" height="76" rx="16" fill="#ffffff" stroke="#3b2230" stroke-width="3"/>
    <text x="342" y="316" font-size="15" fill="#3b2230" fill-opacity="0.7">Mesa</text>
    <text x="342" y="350" class="titulo" font-size="32" fill="#3b2230">3</text>
  </g>

  <!-- Tecnologías -->
  <g class="texto" font-size="17" font-weight="700" fill="#3b2230">
    <rect x="420" y="296" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.8"/>
    <text x="479" y="319" text-anchor="middle">.NET 10</text>
    <rect x="548" y="296" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.8"/>
    <text x="614" y="319" text-anchor="middle">Angular 21</text>
    <rect x="420" y="338" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.8"/>
    <text x="486" y="361" text-anchor="middle">SQL Server</text>
    <rect x="562" y="338" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.8"/>
    <text x="612" y="361" text-anchor="middle">Dapper</text>
  </g>

  <!-- Helado -->
  <g transform="translate(905 0)">
    <ellipse cx="0" cy="392" rx="120" ry="12" fill="#3b2230" fill-opacity="0.08"/>
    <!-- Cono -->
    <path d="M -78 228 L 78 228 L 0 385 Z" fill="url(#barquillo)" stroke="#3b2230" stroke-width="5" stroke-linejoin="round"/>
    <!-- Bolas -->
    <circle cx="-48" cy="196" r="58" fill="#9fe1cb" stroke="#3b2230" stroke-width="5"/>
    <circle cx="48" cy="196" r="58" fill="#fac775" stroke="#3b2230" stroke-width="5"/>
    <circle cx="0" cy="128" r="64" fill="#f4c0d1" stroke="#3b2230" stroke-width="5"/>
    <!-- Brillos -->
    <path d="M -28 92 Q -14 80 4 80" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M -80 172 Q -70 160 -56 158" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M 22 168 Q 32 158 46 156" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Chispas -->
    <g stroke-linecap="round" stroke-width="6">
      <line x1="-22" y1="120" x2="-12" y2="112" stroke="#3b2230"/>
      <line x1="20" y1="104" x2="30" y2="112" stroke="#ffffff"/>
      <line x1="10" y1="146" x2="22" y2="146" stroke="#9fe1cb"/>
      <line x1="-36" y1="150" x2="-30" y2="140" stroke="#fac775"/>
    </g>
    <!-- Cereza -->
    <path d="M 4 66 Q 14 40 34 34" fill="none" stroke="#3b2230" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="66" r="15" fill="#e0457b" stroke="#3b2230" stroke-width="5"/>
  </g>
</svg>
